# NexaHeart infrastructure. Run from the repo root:
#   pnpm infra:up                       -> core services (postgres, redis, object storage)
#   docker compose ... --profile full   -> + ClamAV malware scanning (recommended in production)
#   docker compose ... --profile ai     -> + Ollama local AI
#   docker compose ... --profile video  -> + LiveKit for video dates (see docs/SELF_HOSTING.md)
#   docker compose ... --profile dev    -> + Mailpit (catches outgoing email locally)
# All ports bind to 127.0.0.1 only; expose services publicly through the reverse proxy, never directly.
name: nexaheart

# Logs contain IP addresses (personal data): keep them small and short-lived. With these limits each
# service keeps at most ~50 MB of logs; ship them elsewhere only with a retention policy (docs/PRIVACY.md).
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    build: ./postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - 'yes'
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # S3-compatible object storage (Apache-2.0). Replaces MinIO, whose community edition is no longer maintained.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    # Each bucket is a collection with its own volumes; an explicit slot count (volumes are
    # sparse files, ~1 GB max each) avoids "no writable volumes" when buckets are added.
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0 -volume.max=64 -master.volumeSizeLimitMB=1024
    volumes:
      - seaweedfs-data:/data
      # Generated by install.sh (contains credentials, never committed).
      - ./data/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - '127.0.0.1:8333:8333'

  clamav:
    image: clamav/clamav:1.5.4-debian
    profiles: [full]
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    ports:
      - '127.0.0.1:3310:3310'

  ollama:
    image: ollama/ollama:0.40.6
    profiles: [ai]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - '127.0.0.1:11434:11434'

  # Video dates (Apache-2.0). Signalling and its API stay on 127.0.0.1 (public only through Caddy
  # at RTC_DOMAIN); the media ports must be reachable from the internet. Config written by install.sh.
  livekit:
    image: livekit/livekit-server:v1.13.10
    profiles: [video]
    restart: unless-stopped
    logging: *logging
    command: --config /etc/livekit.yaml
    volumes:
      - ./data/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '127.0.0.1:7880:7880'
      - '7881:7881'
      - '7882:7882/udp'

  mailpit:
    image: axllent/mailpit:v1.31.6
    profiles: [dev]
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

  api:
    logging: *logging
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles: [app]
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://seaweedfs:8333
      # Inside Docker "localhost" is the container itself; set SMTP_HOST_DOCKER (e.g. mailpit) if needed.
      SMTP_HOST: ${SMTP_HOST_DOCKER:-${SMTP_HOST}}
      OLLAMA_URL: http://ollama:11434
      LIVEKIT_API_URL: http://livekit:7880
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:4000:4000'

  worker:
    logging: *logging
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    profiles: [app]
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://seaweedfs:8333
      CLAMAV_HOST: clamav
      OLLAMA_URL: http://ollama:11434
      LIVEKIT_API_URL: http://livekit:7880
      SMTP_HOST: ${SMTP_HOST_DOCKER:-${SMTP_HOST}}
      # Voice transcripts (phase 26): the speech model is kept here across restarts.
      TRANSCRIPTS_CACHE: /models
    volumes:
      - models-data:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Public site: web app, moderation dashboard and API behind one domain with automatic HTTPS.
  web:
    logging: *logging
    build:
      context: ..
      dockerfile: infra/web/Dockerfile
      args:
        API_URL: https://api.${DOMAIN:-localhost}
    profiles: [app]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # Video dates: the LiveKit address (rtc.example.org). The default never requests a certificate.
      RTC_DOMAIN: ${RTC_DOMAIN:-rtc.localhost}
      # Integrations (phase 24): hosts the web app may load a CAPTCHA or analytics from.
      CSP_EXTRA_HOSTS: ${CSP_EXTRA_HOSTS:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  seaweedfs-data:
  clamav-data:
  ollama-data:
  models-data:
