name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Voice messages are re-encoded with ffmpeg (worker unit tests and the integration suite).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Software bill of materials (CycloneDX)
        run: |
          pnpm sbom
          node -e "const b=require('./sbom.cdx.json'); if (b.bomFormat !== 'CycloneDX' || !(b.components?.length > 0)) process.exit(1); console.log(b.components.length + ' components')"

  integration:
    name: Integration tests (Postgres, Redis, S3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: ./install.sh
      - run: docker compose -f infra/docker-compose.yml --env-file .env up -d --build --wait postgres redis
      - run: docker compose -f infra/docker-compose.yml --env-file .env up -d seaweedfs
      - name: Wait for object storage
        run: |
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/)" = "403" ] && exit 0
            sleep 2
          done
          exit 1
      # Voice messages are re-encoded with ffmpeg (worker unit tests and the integration suite).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @dateos/api test:integration

  installer:
    name: Installer and compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash -n install.sh
      - run: ./install.sh
      - name: No placeholders left in generated .env
        run: '! grep -E "^[A-Z0-9_]+=.*CHANGE_ME" .env'
      - run: docker compose -f infra/docker-compose.yml --env-file .env config --quiet
      - name: Production install (--domain) and web server config
        run: |
          ./install.sh --force --domain example.org
          grep -q '^PUBLIC_API_URL=https://api.example.org$' .env
          grep -q '^NODE_ENV=production$' .env
          docker compose -f infra/docker-compose.yml --env-file .env --profile app config --quiet
          docker run --rm -e DOMAIN=example.org -v "$PWD/infra/web/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  docker:
    name: Docker image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - app: api
            file: apps/api/Dockerfile
          - app: worker
            file: apps/worker/Dockerfile
          - app: web
            file: infra/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: dateos-${{ matrix.app }}:ci

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Personal-account repos need no license; organization forks must set GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
