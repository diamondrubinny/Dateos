packages:
  - apps/*
  - packages/*
  - e2e
onlyBuiltDependencies:
  - esbuild
# Advisories reviewed in docs/SECURITY_REVIEW.md: build-time tooling only (Expo CLI, Metro,
# drizzle-kit), never run by the API or worker, with no patched version available. Re-check monthly.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge via @expo/cli (dev HTTPS certificates)
    - GHSA-vfj7-8cjw-p6xm # braces via metro-file-map (build-time globs we control)
    - GHSA-mrhx-c7xc-m3w5 # zod 3 via @expo/cli (validates local config; our own code uses zod >= 4.6.6)
# Patched versions for advisories in build-time tooling (phase 21). Both are used only while
# generating migrations (drizzle-kit's loader) or an iOS project (Expo's config plugins).
overrides:
  # One sharp for the worker: Transformers.js only loads it for images, which we never give it.
  '@huggingface/transformers>sharp': 0.35.5
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
  'xcode>uuid': ^11.1.1
  # Expo's CLI (dev server certificates only, never in the app): the October 2026 node-forge
  # advisories (PEM ReDoS, PKCS#12, TLS records, X.509) are fixed from 1.4.1.
  'node-forge': ^1.4.1
